[[local|localrc]]

# ==========================================
# OPENSTACK DEPLOYMENT CREDENTIALS
# ==========================================
ADMIN_PASSWORD=openstack
DATABASE_PASSWORD=openstack
RABBIT_PASSWORD=openstack
SERVICE_PASSWORD=openstack
SERVICE_TOKEN=openstack

# ==========================================
# LOW RAM / RESOURCE OPTIMIZATIONS
# ==========================================
# Limit API worker processes to 1 per service to reduce RAM usage (default is CPU-core dependent).
# This is crucial for hosts with less than 16GB RAM.
API_WORKERS=1

# ==========================================
# NETWORK AND MULTI-NODE SETTINGS
# ==========================================
# Replace with the actual Tailscale IP of your Mini PC (Control Node), e.g., 100.94.90.62
HOST_IP=100.94.90.62

# Enable Multi-Host deployment
MULTI_HOST=1

# Use OVN as the networking agent
Q_AGENT=ovn

# ==========================================
# ENABLED SERVICES (CONTROL PLANE ONLY)
# ==========================================
# Disable the hypervisor (n-cpu) on the Control Node to save RAM & CPU
disable_service n-cpu

# Disable Tempest to avoid Python package dependency conflicts
disable_service tempest

# Enable OVN services
enable_service ovn-northd
enable_service ovn-controller
enable_service q-ovn-metadata-agent

# Disable conflicting classic Neutron agents
disable_service q-agt
disable_service q-l3
disable_service q-dhcp
disable_service q-meta

# Enable Swift services required for Module 4 (Keystone, Glance, Nova control, Neutron OVN, and Cinder are enabled by default)
enable_service s-proxy s-object s-container s-account

# ==========================================
# HEAT (ORCHESTRATION) CONFIGURATION
# ==========================================
# Enable Heat plugin (requires Git clone during stack.sh)
enable_plugin heat https://opendev.org/openstack/heat stable/2025.2

# ==========================================
# NETWORK CUSTOMIZATIONS
# ==========================================
# Define the floating IP range used for external routing.
# Your macOS machine will access these floating IPs via Tailscale subnet routing
FLOATING_RANGE=172.24.4.0/24
Q_FLOATING_ALLOCATION_POOL=start=172.24.4.10,end=172.24.4.250

# Tailscale MTU adjustment (Tailscale standard MTU is 1280, Geneve/VXLAN overlay needs headroom)
global_physnet_mtu=1200

# ==========================================
# LOGGING CONFIGURATION (OPTIONAL BUT RECOMMENDED)
# ==========================================
LOGFILE=/opt/stack/logs/stack.sh.log
LOG_COLOR=False
LOGDIR=/opt/stack/logs

# ==========================================
# OVN TUNNEL CONFIGURATION (FIX FOR CRITICAL ERROR)
# ==========================================
# OVN requires Geneve tunnel header size to be at least 38 to hold metadata.
[[post-config|/etc/neutron/plugins/ml2/ml2_conf.ini]]
[ml2_type_geneve]
max_header_size = 38

