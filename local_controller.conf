[[local|localrc]]

# ==========================================
# OPENSTACK DEPLOYMENT CREDENTIALS
# ==========================================
ADMIN_PASSWORD=your_secure_password
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD
SERVICE_TOKEN=$ADMIN_PASSWORD

# ==========================================
# NETWORK AND MULTI-NODE SETTINGS
# ==========================================
# Replace 192.168.1.100 with the actual IP address of your Mini PC (Control Node)
HOST_IP=192.168.1.100

# Enable Multi-Host deployment
MULTI_HOST=1

# ==========================================
# ENABLED SERVICES (CONTROL PLANE ONLY)
# ==========================================
# Disable the hypervisor (n-cpu) on the Control Node to save RAM & CPU
disable_service n-cpu

# Enable core control plane services (Glance, Nova Control, Horizon, Keystone, Cinder, Neutron)
enable_service key mysql rabbit
enable_service g-api g-reg
enable_service n-api n-cond n-sch n-novnc n-api-meta n-crd
enable_service horizon
enable_service cinder c-api c-vol c-sch
enable_service neutron q-svc q-dhcp q-l3 q-meta

# ==========================================
# SWIFT (OBJECT STORAGE) CONFIGURATION
# ==========================================
# Enable Swift services required for Module 4
enable_service s-proxy s-object s-container s-account

# ==========================================
# HEAT (ORCHESTRATION) CONFIGURATION
# ==========================================
# Enable Heat plugin (requires Git clone during stack.sh)
enable_plugin heat https://opendev.org/openstack/heat stable/2024.2

# ==========================================
# NETWORK CUSTOMIZATIONS
# ==========================================
# Define the floating IP range used for external routing.
# Your macOS machine will add a static route to this subnet via HOST_IP
FLOATING_RANGE=172.24.4.0/24
Q_FLOATING_ALLOCATION_POOL=start=172.24.4.10,end=172.24.4.250

# Use Open vSwitch for Neutron
Q_AGENT=openvswitch
Q_TUNNEL_TYPES=vxlan

# ==========================================
# LOGGING CONFIGURATION (OPTIONAL BUT RECOMMENDED)
# ==========================================
LOGFILE=/opt/stack/logs/stack.sh.log
LOG_COLOR=False
LOGDIR=/opt/stack/logs
