[[local|localrc]]

# ==========================================
# OPENSTACK DEPLOYMENT CREDENTIALS
# ==========================================
# MUST MATCH THE CONTROL NODE CREDENTIALS
ADMIN_PASSWORD=your_secure_password
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD
SERVICE_TOKEN=$ADMIN_PASSWORD

# ==========================================
# NETWORK AND MULTI-NODE SETTINGS
# ==========================================
# Replace with the actual Tailscale IP of this Compute Node (Ubuntu 26), e.g., 100.99.10.30
HOST_IP=100.99.10.30

# Replace with the actual Tailscale IP of the Control Node (Mini PC), e.g., 100.94.90.62
SERVICE_HOST=100.94.90.62

# Enable Multi-Host deployment
MULTI_HOST=1

# Use OVN as the networking agent
Q_AGENT=ovn

# ==========================================
# SERVICES ON COMPUTE NODE
# ==========================================
# Enable only the hypervisor (n-cpu) and the Neutron OVN compute agents
ENABLED_SERVICES=n-cpu,ovn-controller,q-ovn-metadata-agent

# ==========================================
# CONNECTIONS TO THE CONTROL NODE
# ==========================================
# Tell this compute node where to find database, message queue, and API services
MYSQL_HOST=$SERVICE_HOST
RABBIT_HOST=$SERVICE_HOST
GLANCE_HOSTPORT=$SERVICE_HOST:9292
KEYSTONE_AUTH_HOST=$SERVICE_HOST
KEYSTONE_SERVICE_HOST=$SERVICE_HOST

# ==========================================
# NETWORK CUSTOMIZATIONS
# ==========================================
# Point to the OVN Southbound Database on the Control Node
OVN_SB_REMOTE=tcp:$SERVICE_HOST:6642

# Tailscale MTU adjustment (Tailscale standard MTU is 1280, Geneve/VXLAN overlay needs headroom)
global_physnet_mtu=1200

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
LOGFILE=/opt/stack/logs/stack.sh.log
LOG_COLOR=False
LOGDIR=/opt/stack/logs
